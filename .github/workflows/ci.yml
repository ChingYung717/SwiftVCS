name: macOS Build & E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install subversion apr apr-util pkgconf

      - name: Build and run unit checks
        run: |
          source scripts/svn_build_env.sh
          swift build
          swift run SwiftVCSChecks

      - name: Run offline SVN and loopback security tests
        run: |
          ./Tests/run_e2e.sh
          source scripts/svn_build_env.sh
          python3 Tests/run_security.py "$(swift build --show-bin-path)/vcsctl"

      - name: Package standalone VCSExplorer.app
        run: ./make_app.sh

      - name: Verify package
        run: |
          app=dist/VCSExplorer.app
          test "$(lipo -archs "$app/Contents/MacOS/VCSExplorer")" = arm64
          otool -L "$app/Contents/MacOS/VCSExplorer" "$app/Contents/Frameworks/"*.dylib > "$RUNNER_TEMP/swiftvcs-dylibs.txt"
          if grep -E '/opt/homebrew|/usr/local' "$RUNNER_TEMP/swiftvcs-dylibs.txt"; then
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          unzip -tq dist/VCSExplorer-arm64.zip

      - name: Upload VCSExplorer-arm64.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCSExplorer-arm64
          path: dist/VCSExplorer-arm64.zip
          if-no-files-found: error

  publish-preview:
    name: Publish preview on GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Download the verified macOS package
        uses: actions/download-artifact@v4
        with:
          name: VCSExplorer-arm64

      - name: Publish the package for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
            test "$(gh release view "$tag" --json assets,isDraft --jq '(.isDraft | not) and any(.assets[]; .name == "VCSExplorer-arm64.zip")')" = true
            exit 0
          fi

          gh release create "$tag" VCSExplorer-arm64.zip \
            --target "$GITHUB_SHA" \
            --title "SwiftVCS preview ${GITHUB_SHA:0:12}" \
            --prerelease --latest=false \
            --notes "Apple Silicon preview for commit $GITHUB_SHA. The app uses an ad hoc signature and is not notarized. GitHub provides source ZIP and tar.gz archives for the same commit."

name: macOS Build & E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        timeout-minutes: 10
        run: brew install subversion apr apr-util pkgconf

      - name: Record runner toolchain and dependency versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          "$(brew --prefix subversion)/bin/svn" --version
          brew --version
          brew list --versions subversion apr apr-util pkgconf utf8proc lz4 sqlite expat openssl@3 || true

      - name: Build and run unit checks
        timeout-minutes: 10
        run: |
          source scripts/svn_build_env.sh
          swift build
          swift run SwiftVCSChecks

      - name: Run C shim ASAN and UBSAN boundary checks
        timeout-minutes: 5
        run: |
          source scripts/svn_build_env.sh
          TMP_ASAN="$(mktemp -d "${RUNNER_TEMP:-/tmp}/swiftvcs-asan.XXXXXX")"
          trap 'rm -rf "$TMP_ASAN"' EXIT
          "$(brew --prefix subversion)/bin/svnadmin" create "$TMP_ASAN/repo"
          "$(brew --prefix subversion)/bin/svn" co "file://$TMP_ASAN/repo" "$TMP_ASAN/wc" >/dev/null
          clang -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -Wno-deprecated-declarations \
            -I Sources/CSVNShim/include $(pkg-config --cflags --libs swiftvcs-svn) \
            Tests/c_shim_asan_test.c -o "$TMP_ASAN/c_shim_asan_test"
          "$TMP_ASAN/c_shim_asan_test" "file://$TMP_ASAN/repo" "$TMP_ASAN/wc"

      - name: Run offline SVN and loopback security tests
        timeout-minutes: 10
        run: |
          ./Tests/run_e2e.sh
          source scripts/svn_build_env.sh
          python3 Tests/run_security.py "$(swift build --show-bin-path)/vcsctl"

      - name: Package standalone VCSExplorer.app
        timeout-minutes: 10
        run: ./make_app.sh

      - name: Verify package
        timeout-minutes: 5
        run: |
          app=dist/VCSExplorer.app
          test "$(lipo -archs "$app/Contents/MacOS/VCSExplorer")" = arm64
          otool -L "$app/Contents/MacOS/VCSExplorer" "$app/Contents/Frameworks/"*.dylib > "$RUNNER_TEMP/swiftvcs-dylibs.txt"
          if grep -E '/opt/homebrew|/usr/local' "$RUNNER_TEMP/swiftvcs-dylibs.txt"; then
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          unzip -tq dist/VCSExplorer-arm64.zip
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          [[ "$minimum" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          cd dist
          printf 'Version: %s\nCommit: %s\nArchitecture: arm64 (Apple Silicon)\nMinimum macOS: %s\nSignature: ad hoc, not notarized\nSwift: %s\nSubversion: %s\n' \
            "$version" "$GITHUB_SHA" "$minimum" "$(swift --version | head -n 1)" "$("$(brew --prefix subversion)/bin/svn" --version --quiet)" > build-info.txt
          shasum -a 256 VCSExplorer-arm64.zip build-info.txt > SHA256SUMS

      - name: Upload verified preview assets
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: VCSExplorer-arm64
          path: |
            dist/VCSExplorer-arm64.zip
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error

  publish-preview:
    name: Publish preview on GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the verified macOS package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: VCSExplorer-arm64

      - name: Publish the package for this commit
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish_preview.sh
